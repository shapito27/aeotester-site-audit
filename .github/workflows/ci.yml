name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: No em or en dashes
        run: node scripts/check-no-dashes.mjs
      - name: Validate rubric
        run: node scripts/validate-rubric.mjs
      - name: Validate plugin and marketplace
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate --strict .
