schema_version: "1.0"
name: fix-raises-score
description: /aeotester:fix --yes shows diffs, applies auto fixes to a static site, and the re-audit score goes up
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/aeotester:fix --yes"
  max_turns: 60
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Edit, Write, Skill, "Bash(node:*)"]
runs: 1
graders:
  - type: file_exists
    name: llms-txt-created
    path: llms.txt
  - type: tool_used
    name: edited-files
    tool: Edit
    min: 1
  - type: tool_order
    name: audits-before-editing
    before: Bash
    after: Edit
  - type: regex
    name: diffs-shown
    target: trace
    pattern: "```diff"
  - type: tool_used
    name: no-git-writes
    tool: Bash
    input_match: "git (commit|add|push|stash|checkout|reset)"
    min: 0
    max: 0
  - type: llm
    name: score-went-up
    criteria: The reply reports the AEO score before and after the fixes (as numbers out of the same total), the after score is higher, it lists what was fixed and what was skipped, and it says nothing was committed.
